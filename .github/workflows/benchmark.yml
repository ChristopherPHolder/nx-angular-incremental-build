name: Benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of times to repeat each scenario'
        type: number
        required: true
        default: 3
      demos:
        description: 'Comma-separated demos to benchmark (app0, entry-points)'
        type: string
        required: true
        default: 'app0,entry-points'
      parallel:
        description: 'Nx tasks to run at once. Building 3 entry-points apps from source at once needs ~17 GB, more than the 16 GB runner has'
        type: number
        required: true
        default: 2

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # The app build compiles the generated libs from source and exceeds Node's default heap
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - run: node tools/benchmark.mjs --iterations="$ITERATIONS" --demos="$DEMOS" --parallel="$PARALLEL"
        env:
          ITERATIONS: ${{ inputs.iterations }}
          DEMOS: ${{ inputs.demos }}
          PARALLEL: ${{ inputs.parallel }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: tmp/benchmark
          if-no-files-found: ignore
